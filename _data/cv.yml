    Experience:
      - company: Google
        position: Research Software Engineer, Generative AI
        location: London, UK
        start_date: 2026-09-01
        highlights:
          - Research and engineering on generative AI for 3D/4D vision applications.

      - company: Huawei Research
        position: Senior Research Engineer
        location: London, UK
        start_date: 2020-06-01
        end_date: 2026-09-01
        highlights:
          - Led computer vision research on neural rendering, 3D/4D reconstruction, and generative modelling of humans and scenes, including feed-forward Gaussian splatting for novel-view synthesis.
          - Designed and trained large-scale generative 3D models (statistical, mesh-based, and implicit morphable representations) for high-fidelity human modelling.
          - Built end-to-end data pipelines for multi-view, RGB-D, and 4D capture data, supporting model training, evaluation, and deployment on complex visual datasets.
          - Drove evaluation and ablation methodology for reconstruction quality, geometric accuracy, and view-consistency, enabling systematic model comparison and iteration.
          - Translated research prototypes into integration-ready systems in collaboration with infrastructure and engineering teams; supervised junior researchers and contributed to research direction setting.
          - Co-organised the View Synthesis Challenge for Human Heads at ICCVW 2023.

      - company: Facesoft
        position: Senior Research Engineer
        location: London, UK
        start_date: 2019-11-01
        end_date: 2020-06-01
        highlights:
          - Developed deep learning models for face analysis, recognition, and representation learning, deployed in real-time production computer vision systems.
          - Designed data processing and training pipelines for large-scale face datasets, with emphasis on robustness across demographics and capture conditions.

      - company: Institute of Child Health, UCL
        position: Research Associate
        location: London, UK
        start_date: 2018-01-01
        end_date: 2019-10-01
        highlights:
          - Developed statistical and deep learning methods for analysing complex 3D craniofacial datasets, including mesh autoencoders for clinical 3D shape analysis.
          - Built data processing and evaluation workflows for clinical 3D datasets and collaborated with surgeons, clinicians, and researchers on translational ML projects.
          - Contributed to peer-reviewed publications on 3D shape modelling and clinical decision support.

      - company: Imperial College London
        position: Research Associate
        location: London, UK
        start_date: 2017-01-01
        end_date: 2018-12-01
        highlights:
          - Developed face tracking and verification systems for secure online assessment platforms, including identity verification and behavioural analysis components deployed at scale.

      - company: Imperial College London
        position: Research Assistant
        location: London, UK
        start_date: 2012-10-01
        end_date: 2016-12-01
        highlights:
          - Built large-scale 4D facial datasets for emotion and behaviour recognition research; developed algorithms for automated facial analysis and statistical 3D modelling.
          - Contributed to national and European research projects on face and behaviour analysis.

